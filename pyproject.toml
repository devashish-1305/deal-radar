[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-radar"
version = "0.1.0"
description = "Rank private companies by likelihood of an announced change of control."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
    "pandas==2.1.4",
    "requests==2.31.0",
    "python-dotenv==0.21.0",
    "anthropic==1.5.0",
]

[project.optional-dependencies]
dev = ["pytest==7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
